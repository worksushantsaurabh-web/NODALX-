<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .bg {
    position: absolute;
    inset: 0;
    background: #0f172a;
  }

  .accent-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: #0d9488;
  }

  .container {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-mark {
    width: 40px;
    height: 40px;
    background: #0d9488;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-name {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.02em;
  }

  .headline {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px 0 32px;
  }

  .label {
    font-size: 14px;
    font-weight: 600;
    color: #0d9488;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 60px;
    font-weight: 800;
    color: #fff;
    line-height: 1.1;
    letter-spacing: -0.03em;
    max-width: 820px;
  }

  h1 span {
    color: #2dd4bf;
  }

  .sub {
    font-size: 22px;
    color: #94a3b8;
    margin-top: 24px;
    max-width: 640px;
    line-height: 1.5;
  }

  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .pills {
    display: flex;
    gap: 12px;
  }

  .pill {
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid #1e293b;
    font-size: 13px;
    color: #64748b;
    font-weight: 500;
  }

  .cta {
    padding: 14px 28px;
    background: #0d9488;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="accent-bar"></div>
<div class="container">
  <div class="logo-row">
    <div class="logo-mark">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M4 4 L18 18 M18 4 L4 18" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <circle cx="4" cy="4" r="2.5" fill="white"/>
        <circle cx="18" cy="4" r="2.5" fill="white"/>
        <circle cx="4" cy="18" r="2.5" fill="white"/>
        <circle cx="18" cy="18" r="2.5" fill="white"/>
        <circle cx="11" cy="11" r="2" fill="#2dd4bf"/>
      </svg>
    </div>
    <span class="logo-name">NODALxAI</span>
  </div>

  <div class="headline">
    <div class="label">B2B Inquiry Automation</div>
    <h1>Every inquiry answered.<br/>Every lead scored.<br/><span>Nothing missed.</span></h1>
    <p class="sub">Capture, qualify, and convert business inquiries automatically — set up in 15 minutes.</p>
  </div>

  <div class="footer-row">
    <div class="pills">
      <div class="pill">Lead qualification</div>
      <div class="pill">Auto reply drafts</div>
      <div class="pill">Google Sheets sync</div>
      <div class="pill">Live dashboard</div>
    </div>
    <div class="cta">Get Early Access →</div>
  </div>
</div>
</body>
</html>
