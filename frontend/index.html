<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Anti-flash: set dark class + block transitions until React has fully painted -->
    <script>
      try {
        var s = localStorage.getItem('theme');
        if (s === 'dark' || (!s && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
        document.documentElement.classList.add('theme-loading');
        window.addEventListener('load', function() {
          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              document.documentElement.classList.remove('theme-loading');
            });
          });
        });
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>NODALxAI — Capture, Qualify, and Convert Business Inquiries Automatically</title>
    <meta name="description" content="NODALxAI reads your incoming business inquiries, scores each lead against your criteria, and drafts a ready-to-send reply — in seconds, not hours." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NODALxAI — Automated Inquiry Qualification &amp; Response" />
    <meta property="og:description" content="Every inquiry answered. Every lead scored. Nothing missed. Set up in 15 minutes, no developer required." />
    <meta property="og:url" content="https://nodalxai.com" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->

    <meta name="twitter:description" content="Every inquiry answered. Every lead scored. Nothing missed." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Canonical -->

    <!-- Favicon + icons -->
