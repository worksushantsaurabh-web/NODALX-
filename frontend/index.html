<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>NODALxAI - Business Inquiry Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            },
            colors: {
              teal: {
                50: '#f0fdfa',
                100: '#ccfbf1',
                200: '#99f6e4',
                300: '#5eead4',
                400: '#2dd4bf',
                500: '#14b8a6',
                600: '#0d9488',
                700: '#0f766e',
                800: '#115e59',
                900: '#134e4a',
              }
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'fade-in': 'fadeIn 0.3s ease-out forwards',
              'scale-in': 'scaleIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
              'shimmer': 'shimmer 2.5s linear infinite',
              'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
              'draw-path': 'drawPath 2s ease-out forwards',
              'flow-line': 'flowLine 1s linear infinite',
              'glass-shine': 'glassShine 3s ease-in-out infinite',
              'border-glow': 'borderGlow 3s ease-in-out infinite',
              'shake': 'shake 0.5s ease-in-out',
              'slide-up': 'slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              travelDown: {
                '0%': { top: '0%', opacity: '0' },
                '20%': { opacity: '1' },
                '80%': { opacity: '1' },
                '100%': { top: '100%', opacity: '0' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              scaleIn: {
                '0%': { transform: 'scale(0.85) translateY(10px)', opacity: '0' },
                '100%': { transform: 'scale(1) translateY(0)', opacity: '1' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' }
              },
              pulseGlow: {
                '0%, 100%': { transform: 'scale(1)', boxShadow: '0 0 15px rgba(20, 184, 166, 0.3)' },
                '50%': { transform: 'scale(1.02)', boxShadow: '0 0 25px rgba(20, 184, 166, 0.6)' },
              },
              drawPath: {
                'to': { strokeDashoffset: '0' }
              },
              flowLine: {
                'from': { strokeDashoffset: '20' },
                'to': { strokeDashoffset: '0' }
              },
              glassShine: {
                '0%': { backgroundPosition: '-200% 0' },
                '50%': { backgroundPosition: '200% 0' },
                '100%': { backgroundPosition: '-200% 0' },
              },
              borderGlow: {
                '0%, 100%': { borderColor: 'rgba(20, 184, 166, 0.15)' },
                '50%': { borderColor: 'rgba(20, 184, 166, 0.4)' },
              },
              shake: {
                '0%, 100%': { transform: 'translateX(0)' },
                '20%': { transform: 'translateX(-4px)' },
                '40%': { transform: 'translateX(4px)' },
                '60%': { transform: 'translateX(-3px)' },
                '80%': { transform: 'translateX(2px)' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(16px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            }
          }
        }
      }
    </script>
    <style>
      /* Glass card utility */
      .glass-card {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .dark .glass-card {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      /* Glass shine overlay */
      .glass-shine {
        position: relative;
        overflow: hidden;
      }
      .glass-shine::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          105deg,
          transparent 40%,
          rgba(255, 255, 255, 0.08) 45%,
          rgba(255, 255, 255, 0.15) 50%,
          rgba(255, 255, 255, 0.08) 55%,
          transparent 60%
        );
        background-size: 200% 100%;
        animation: glassShine 3s ease-in-out infinite;
        pointer-events: none;
      }
      /* Modal backdrop blur */
      .modal-backdrop {
        backdrop-filter: blur(8px) saturate(150%);
        -webkit-backdrop-filter: blur(8px) saturate(150%);
      }
      /* Prevent horizontal scroll on mobile */
      html, body {
        overflow-x: hidden;
        max-width: 100vw;
      }
    </style>
      </head>
  <body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-50 transition-colors duration-300 font-sans">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.js"></script></body>
</html>
