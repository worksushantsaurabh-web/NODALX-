AWSTemplateFormatVersion: '2010-09-09'
Description: Parallel NODALX API host in the existing RDS VPC; does not alter public RDS access.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  ApiInstanceProfileName:
    Type: String
    Default: nodalx-api-instance-profile
    AllowedValues: [nodalx-api-instance-profile]
    Description: Pre-created, narrowly scoped instance profile; no IAM principal is created by this stack
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.micro, t4g.small]
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Resources:
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NODALX API HTTPS and certificate challenge only; no SSH
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP certificate challenge and HTTPS redirect
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS API access
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: RDS, hosted Auth, Resend, updates and SSM
      Tags:
        - Key: Name
          Value: nodalx-api

  ApiToRdsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ApiSecurityGroup
      Description: Private NODALX API to RDS

  ApiInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref ApiInstanceProfileName
      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: !Ref PublicSubnetId
          GroupSet: [!Ref ApiSecurityGroup]
          AssociatePublicIpAddress: false
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 20
            Encrypted: true
            DeleteOnTermination: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      Tags:
        - Key: Name
          Value: nodalx-api

  ApiElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: nodalx-api

  ApiElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ApiElasticIp.AllocationId
      InstanceId: !Ref ApiInstance

Outputs:
  InstanceId:
    Value: !Ref ApiInstance
  PublicIp:
    Value: !Ref ApiElasticIp
  ApiSecurityGroupId:
    Value: !Ref ApiSecurityGroup
